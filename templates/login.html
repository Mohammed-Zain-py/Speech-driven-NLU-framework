{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card mt-5">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Project Login</h3>
                <form action="{{ url_for('login') }}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password (for admin)</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Leave blank for user login">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login & Start</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
